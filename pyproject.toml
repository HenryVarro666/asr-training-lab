[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-lab"
version = "0.1.0"
description = "Reproducible Qwen3-ASR and Whisper fine-tuning, evaluation, and failure diagnosis"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.5,<3", "transformers==4.57.6", "numpy>=1.26,<3", "soundfile>=0.12", "PyYAML>=6", "jiwer>=3.1,<5", "tensorboard>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]
